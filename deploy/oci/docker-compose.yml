# ============================================================================
# APICookbook API on the OCI VM it shares with vam-portal, uc05, liq and EXTN (same shape as EXTN's).
# No database and no Caddy of its own:
#   - State: none worth keeping. The knowledge base loads from api_specs/ + collections/ at start.
#   - HTTPS: vam-portal's Caddy, site block in deploy/oci/Caddyfile.cookbook.
# The frontend is not here: it deploys to Vercel and reaches this over a rewrite (frontend/vercel.json).
# deploy/oci/.env (untracked, mode 600) holds RUNNER_TOKEN, Build & run's key to the sandbox host.
# Without it /api/build answers 503. The Anthropic key lives only on the sandbox host.
#
#   sudo docker compose up -d --build     (run by .github/workflows/deploy-oci.yml)
# ============================================================================
name: cookbook  # not the directory name: vam-portal's project is already called `oci`

services:
  cookbook-api:
    build: { context: ../.. }
    image: cookbook-api:latest
    container_name: cookbook-api  # the deploy workflow execs into it by this name
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }  # uncapped logs have filled this disk before
    expose: ["7600"]  # reached by Caddy over oci_default; never published
    # Build & run's BaNCS proxy (docs/decode-fork-plan.md, F2a): published on the VM's PRIVATE address
    # only, for the sandbox host (10.0.0.223). OCI's security list and the VM's SANDBOX-IN rules admit
    # nothing else; the internet never sees it.
    ports: ["10.0.0.49:7601:7601"]
    mem_limit: 2g     # shared VM; torch + bge-small + 950 embeddings sit well under this
    volumes:
      # The downloaded bge model and the RAG index cache. Losing it only costs one slow start.
      - cookbook_models:/app/models
      # Build & run's usage ledger (drives its USD caps) and the eval reports.
      - cookbook_data:/app/data
    environment:
      ENVIRONMENT: production
      DEBUG: "false"  # keeps /api/developer/logs closed
      RAG_ENABLED: "true"
      RAG_EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      DISABLE_BERT_SEARCH: "true"
      ENABLE_BERT: "false"  # the BERT chat routes are gone; RAG does the search
      HF_HUB_DISABLE_TELEMETRY: "1"
      # Build & run (F2a): the proxy, the runner on the sandbox host, and its token from .env.
      BUILD_PROXY_PORT: "7601"
      BUILD_PROXY_BASE: http://10.0.0.49:7601
      RUNNER_URL: http://10.0.0.223:7700
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # Open to every visitor (decided 2026-11-09), behind this mode's own caps and ledger.
      BUILD_PUBLIC: "true"
      BUILD_RATE_PER_HOUR: "3"
      BUILD_DAILY_CAP_USD: "5"
      BUILD_MONTHLY_CAP_USD: "50"
      BUILD_DATA_DIR: /app/data/build

volumes:
  cookbook_models:
  cookbook_data:

networks:
  default:
    name: oci_default   # created by vam-portal's compose project
    external: true      # attach, never own: `down` here must not remove the sibling's network
