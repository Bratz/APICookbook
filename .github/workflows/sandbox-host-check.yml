# ============================================================================
# Read-only check of the Build & run sandbox host (instance-20261025-1657, decode fork F1).
# Run it by hand from the Actions tab. It changes nothing on any machine: it only prints
# what F1's setup has to work with.
#
# Repository secrets:
#   SANDBOX_HOST      the sandbox host's public IP
#   SANDBOX_USER      ubuntu
#   SANDBOX_SSH_KEY   the PRIVATE key the sandbox host accepts for SANDBOX_USER
# ============================================================================
name: Sandbox host check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect the sandbox host (read-only)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SANDBOX_HOST }}
          username: ${{ secrets.SANDBOX_USER }}
          key: ${{ secrets.SANDBOX_SSH_KEY }}
          script: |
            section() { echo; echo "== $1"; }
            section "identity";  whoami; hostname; uname -srm
            section "os";        . /etc/os-release && echo "$PRETTY_NAME"
            section "cpu";       nproc; lscpu | grep -E "Model name|Architecture" || true
            section "memory";    free -h
            section "disk";      df -h / | tail -1
            section "docker";    (docker --version && docker info --format '{{.ServerVersion}} runtimes={{range $k,$v := .Runtimes}}{{$k}} {{end}}') 2>&1 || echo "docker: not installed"
            section "gvisor";    (runsc --version 2>&1 | head -1) || echo "runsc: not installed"
            section "firewall";  sudo -n iptables -S INPUT 2>/dev/null | head -15 || echo "(no passwordless sudo, or no iptables)"
            section "ufw";       sudo -n ufw status 2>/dev/null || echo "(ufw not available)"
            section "net: main VM private 10.0.0.49:22";   timeout 4 bash -c '</dev/tcp/10.0.0.49/22' && echo open || echo closed
            section "net: main VM private 10.0.0.49:443";  timeout 4 bash -c '</dev/tcp/10.0.0.49/443' && echo open || echo closed
            section "net: internet (api.anthropic.com)";   curl -s -o /dev/null -w "%{http_code}\n" --max-time 8 https://api.anthropic.com/ || echo unreachable
            section "net: BaNCS demo host";                curl -s -o /dev/null -w "%{http_code}\n" --max-time 8 https://demoapps.tcsbancs.com/ || echo unreachable
            section "listening ports"; ss -tlnp 2>/dev/null | head -15
